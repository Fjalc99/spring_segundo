spring.application.name=data

spring.datasource.url=jdbc:h2:./db/database;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

#Es para decir quien se encarga de crear las tablas y como tienen que crearse
spring.jpa.hibernate.ddl-auto=create-drop

#Es para ver la consulta en el log
spring.jpa.show-sql=true
